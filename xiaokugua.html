　　　　1.

　　很好，又是一个周一，一周美妙的开始啊！Pavel掀开笔记本电脑。

　　“N’Pavel。”

　　很好，不美妙了。

　　当利落清脆的高跟鞋敲地的声音再一次逼近，Pavel游刃有余的迅速将一脸半死不活带着班味儿的表情收回去，换上一个耐心又好脾气的微笑。遗憾的是，这个乐观的笑容显然没能维持很久，它在主管姐姐下一秒发布给他的新工作安排里瞬间消失殆尽。

　　“后天S市的会谈，我们经理需要一名随行助理，相信你是可以胜任的哦？”

　　看似是问话，实则根本没有回头路吧！！！

　　Pavel在心底朝新来的经理扔飞镖。

　　这位老实巴交，勤勤恳恳的社畜，在新领导来的第一天就惨遭毒手，先是被同事Boby背刺，进而一片捧杀中临危受命成为了一个项目的负责人。好在能力过硬，忙前忙后他总算将这个项目完美交差，正在复盘汇报阶段又突然来了个什么产品发布会的策划。

　　Pavel焦头烂额，可对于年轻的经理又可谓是敢怒不敢言，因为据说这位新领导呀，是人家集团的小少爷，平常惯是一副玩世不恭的模样，他这种靠自己努力的打心眼里不太能将其看成是一路人，而最最重要的是，自己的薪水也捏在人家手里。

　　现在竟然又来了一个会谈？这是什么？生产队的驴吗？再怎么样，也不能逮着一个人薅啊！！！我是什么机器人吗！到底为什么会遭这个罪？

　　可……老实巴交如Pavel，新时代的好青年（上一年年终总结他这样评价自己），公司的顶梁柱（来自进公司时原经理给人画的大饼），秉持着干一行爱一行的信念（他得这么想不然他就不干了），怀着高度的社会责任感以及对自我的严格要求（这个倒是真的，他真的很负责且对自己要求超高的……），哪怕内心已经想把他们年轻的小经理千刀万剐，仍旧为了能够在出发S市之前完成策划，在公司待到即将午夜12点。

　　只是他敲击电脑键盘的力度称不上暴力，但也临近疯狂，乍一听，像是下了一场噼里啪啦的电子暴风雨。


　　2．

　　Pavel在乱糟糟的床上醒来。

　　他挠了挠鸡窝一样的头发，坐起身的时候被屋外的阳光闪了眼睛，好一会才看清东西——床尾搭着被胡乱扯出来但未得到青睐的领带，衣架上挂着没有熨烫的衬衫，西服外套也是皱巴巴的，床边还有一坨白色布料，摊开一看，是内裤……

　　老天爷啊，他昨晚已经困成这个样子了吗？倒头就睡？他的确是一直喜欢裸睡，但也没有裸到今天这样一点不剩的地步吧？

　　Pavel低头，一时间有些失语。

　　早上好，我是没什么精神，你倒是挺有精神的。

　　嗯是呢，或许也只有他，会和身边一切事物，活的不活的，会动的不会动的对话，比方说他刚刚就在和自己的小兄弟打招呼。

　　随意套了条裤子，Pavel在房间里走了一圈。窗外洒进来的日光暖洋洋的，他索性将两边的窗帘全拉开，映入眼帘的事屋外一大片农田，大部分都拔地而起了一些绿油油的植物，只有一处地方尚未开垦。

　　他连忙探出头去。

　　我靠？什么情况？隔壁那栋楼呢？那个洗澡老不关窗户的大爷呢？哪去了？

　　“还知道要瞧？”居委会大妈的声音从上面传来，“咱这栋可就只有你忙工作忙得连菜都不种了。”

　　Pavel一抬头，戴着一头烫发卷的女人端着碗面条低头瞧他，“话说Nong你今天不上班吗？”

　　上班……上班！！！天啊！几点了现在是！救了大命了他的全勤啊！！！

　　顾不上和居委会大妈说谢谢，Pavel拿起衬衫就往身上套，也不管领带打的漂亮不漂亮，拿起手机就往公交站台冲。

　　正好一辆公交车从远处驶来。

　　等等？这颜色怎么如此艳丽？气喘吁吁的Pavel定睛一看，不对劲啊，这分明是一根巨大的胡萝卜啊！

　　“小伙子，上车啊！”司机师傅将胡萝卜停在他面前，朝他挥挥手，“今天周二，是胡萝卜日哦！”

　　“周二是胡萝卜日”是什么意思？

　　Pavel对这莫名奇妙的表述感到格外奇怪，但是他坐不上车就会赶不上打卡，于是即便他再怎么觉得这辆公交和司机都不大正常，他还是上车了。

　　可是这位一心只求不迟到的社畜怎么都没在手机页面上找到出行二维码，裤口袋里也没有硬币，摸索间已经惹得好几位乘客侧目看向他。

　　司机大叔也在看他，神色古怪，“年轻人，今天是胡萝卜日，只收胡萝卜，你是忘带了吗？”

　　“阿来呐？”Pavel东翻西找的手一顿，整个人愣在原地。

　　“没有胡萝卜的话可不能坐胡萝卜公交，请你先下车吧。”大叔又按开了已经关上的车门，车门打开掀起一阵风，Pavel闻到了独属于胡萝卜那甜滋滋的气味。

　　“师傅！我来帮他付我来帮他付！”公交车后排突然冒出一只拿着胡萝卜的手。

　　是同事Koko，她整个人神采奕奕，橙色的装扮让她和胡萝卜公交的内部设施几乎浑然一体，怪不得Pavel刚刚压根没有看见她。

　　那根新鲜的带泥的胡萝卜掉进投币箱，Koko扯着Pavel来到后座。

　　“P’Pavel今天没带胡萝卜吗？”小姑娘看起来很高兴，问话的语气也上扬，和在公司见到的怨气十足的模样大相径庭，Pavel注意到就连她那厚重的眼镜框也从往日的纯黑换成了亮橙色。

　　“为什么要带胡萝卜呢？”

　　此话一出，Koko的眼睛都瞪大了，“当然是为了能坐公交去公司呀！P’Pavel你是怎么了？”

　　她的同事这时才像是反应过来一点，也跟着她瞪大眼睛，“哈？去哪里？你再说一遍？”


　　3.

　　进到公司大门里，Pavel捏着胡萝卜的手都在颤抖，他看了看手中Koko给他说是帮他渡过短暂难关的胡萝卜，脑子里一团乱麻，全是刚才Koko给自己科普的新世界观。

　　“周一是苦瓜日，周二是胡萝卜日，周三是土豆日，周四是茄子日，周五是黄瓜日，周六是青木瓜日，周日是卷心菜日。我们每天都是用不同的作物来当车票的呀。居民区和城中心是分隔开来的，现金只有在城中心才可以交易，居民区是没有现金板块的。其他交通工具都不允许驶出城中心，所以来回只有公交。”

　　小姑娘嘴快的飞起，Pavel库库在手机备忘录里打字。

　　“步行也不行？”

　　“不行哦，你可以把小公交理解为联结城中心和居民区的唯一渠道。”

　　“车票怎么来呢？”

　　“当然是去买种子回家种下去收获果实咯！时间的话不用很长，快的话三五分钟，慢的话顶多一个晚上，车票肯定就到手啦！不过要注意使用期限的问题，车票一般都只有三天保留期，逾期就不新鲜，就失效啦！”

　　“那怎么办？”

　　小姑娘耸耸肩，“要不就是吃掉，要不就做肥料咯。”

　　“会有不想乘坐小公交的人吗？”

　　“有啊，比方说周一是苦瓜日，很多人不喜欢苦瓜，就会选择在这天休息。”

　　“还可以选择休息日？”Pavel张大了嘴巴，“我们公司？”

　　“所有公司都一样呀，”小姑娘不能理解他在惊讶些什么，自顾自说，“每周每个人可以任意选择两天休息，如果超过两天就没有工资了，没有工资就买不了种子，没有种子就不会有果实，没有果实等于没有车票，一直一直没有车票的话，就会失去工作。”

　　年长的同事一阵沉默。

　　如果是这样的话，家里那片光秃秃的菜园子，真的很该利用起来啊！Pavel！你在干什么啊！！！

　　Koko看了看神色有些许迷茫又悔恨的前辈，从兜里抓了一根胡萝卜塞在Pavel手里，“前辈这个你拿着，晚上回去赶紧把菜种下去，别被辞了。”（你拿着，晚上回去赶紧把方案写完，不然就把你给辞了）

　　小姑娘蹦蹦跳跳的身影窜进电梯，独留Pavel一人慢慢消化。

　　她是怎么知道我没有种菜的？算了，Pavel甩甩脑袋，还是先工作吧，至少保证明天能搭上小公交来上班。

　　老实巴交的社畜僵硬地迈开腿。

　　变的是这个世界，不变的是凄凄惨惨的打工人，两眼一黑了家人们。


　　4.

　　果然是快。

　　Pavel看着种下去一下就长老高一片的苦瓜藤。

　　因为对青木瓜小公交的偏爱加之周六的辛勤劳动，昨天，也就是周日，他毅然决然给自己放了个假，彻底放飞自我，去逛了香水店，去看了喜爱的摩托车展，还去吃了高级日料。回到家之后把买回来的苦瓜种子种下去，又做了一堆青木瓜沙拉窝在沙发里看《极速恋人》。

　　Charlie真茶啊。

　　他咽下最后一块青木瓜，看着Babe把Charlie领进门开始在料理台上嘴对嘴亲密，让那孩子“了解”自己，这才抬头看向时钟。

　　不知不觉时间已经过了12点。

　　周一了，又是新的一周啦！一周美妙的开始啊！让他来看看苦瓜车票们怎么样了吧！

　　Pavel走进菜园子去看那绿油油的藤蔓。

　　苦瓜藤生长的势头正猛，缠着Pavel搭建的棚子爬了老高，乍一看就有好几个果实含羞带怯藏在宽大的叶子后面，仔细一瞧竟是密密麻麻一架子全都是。

　　“啊呀，怎么疯长啊。”Pavel皱了皱眉，他不是特别爱吃苦瓜，如果是像上周的车票作物们一样结了满院子，青木瓜他尚且能hold住，可这苦瓜他根本不爱吃啊，吃不完全部做肥料的话又真的怪可惜。

　　会和身边一切事物，活的不活的，会动的不会动的对话的Pavel，摸了摸目之所及之处个头最大的那个苦瓜，轻声说，“我只要你一个就够了，其他的也别长了吧。”

　　风吹拂过他的菜园子，满院的苦瓜叶片沙拉拉响，仿佛在给Pavel回答。


　　5.

　　“我的瓜呢？！！！”Pavel不可置信地掀开叶片，露出来的无一例外都是个头小到根本不能够做车费的苦瓜果实。

　　老实巴交的社畜汗流浃背了，本来就快要迟到，这紧要关头居然又在车票上出了差错。

　　其实要不是昨晚熬夜追剧，他今早上一定能提前一点发现这个不幸，速速再种一株小苦瓜的。但是不对啊，他明明记得昨晚自己有看见一个个头不错的小苦瓜，一个晚上再怎么也应该茁壮成长为车票了，怎么会不知所踪了呢？还有现在留下来的这些，个头和昨天晚上的比起来有差别吗？怎么全是一副营养不良的样子啊？难道是昨晚许愿成功了？那我“只要那一个”的愿望怎么没实现啊？苍天，有你这样实现愿望只实现一半的吗？好歹帮人帮到底，送佛送到西啊啊啊！

　　正当Pavel不信邪，打算再从头找一遍时，手机响了。

　　“您好，亲爱的Pavel员工，您已超出我司正常打卡时间1min，”电子设备里传来智能助手冷漠的声音，“请问您是需要今日休假一天吗？”

　　好家伙，这是一点回旋余地没留啊，但是不请假又有什么办法，这次可没有Koko来帮他解围了……我可怜的两天假期难道在周一就要葬送1/2了吗？

　　Pavel拿着手机欲哭无泪，捏着一个瘦巴巴的小苦瓜好一通纠结，“唔……”了许久也没给出确切答复，直到智能助手都受不了他的磨唧劲儿，“大哥你快点的，我这还有下一位呢。”

　　“哦莫不好意思不好意思，”Pavel被手机里突如其来的“人情味儿”吓一跳，差点手机没拿稳，连忙道，“我今天请假。”

　　“早这么说不就完了。”对面智能助手小声嘀嘀咕咕，又猛地切换回机械音，一本正经道，“感谢您对我司工作的配合，祝您周一假期愉快，再见。”

　　Pavel咽了口口水。

　　合着智能助手只是智能在语音包吗？这不还是人工坐席吗？

　　但他没空再理会，他现在比较想知道那个小苦瓜到底去哪了以及这藤上的玩意儿怎么不长了，还有他上周买来的胡萝卜种子是否还有存货，不然他明天也得被不怎么智能的人工助手问候了。

　　大脑飞速运转是会消耗能量的，扶额思考间，站在菜园子里的Pavel肚子咕噜一声响。

　　想个鬼啊先吃饭。

　　Pavel优雅转身，扭头回屋。

　　但他忘记了一件事情，那就是他原本打算这周一下班之后去城中心好好购入一下本周的物资，包括打特价的牛排、新鲜的刺身还有健身时要吃的鸡肉泥和蛋白粉，好填充一下他空空如也的冰箱和储物柜。那么简而言之就是，他家现在除了上周没吃完的三个鲜鸡蛋，半瓶在冰箱里开了没喝完的鲜牛奶，最后一小撮便宜但难吃的通心粉，似乎就没有什么可以端上餐桌的了。

　　哦……还有菜园子里没摘下来的小得可怜并且数量庞大的苦瓜。

　　真的会谢。

　　Pavel此刻的沉默震耳欲聋。

　　“嘭嘭嘭！”

　　似乎是有人在敲门的声音，Pavel切苦瓜的手一顿，随便在围裙上抹了两下，他快步走向门口。

　　“谁呀？”

　　外面许久没人答话，Pavel掀开猫眼往外望去，门口空空的根本不像有人来过。

　　听错了？还是难道是领居家恶作剧的小孩？也不是第一次看他脾气好来玩这种无聊的游戏了。

　　Pavel转身回去准备继续切菜，身后的门正在此时又被敲响了。

　　他一个箭步冲过去，想着势必要抓住顽皮的孩子，结果猫眼里仍是空空如也。

　　Pavel凑近了点，好让自己的声音传出去，也算是对外面人的警告，“玩这种游戏的都是坏孩子……啊啊啊啊啊！”

　　视线里突然多出一双没有什么感情的眸子，给Pavel吓得大叫起来，“我天这什么玩意儿！你谁啊！！！”

　　明明猫眼的外面看不到里面，Pavel却觉得那人正直直的盯着他，眼神又凶又狠。

　　自己什么时候惹是生非了吗？他脑子里开始回想不到一周的时间里自己有没有得罪过什么人，连网购时跟客服的对话都过了个遍，也没想通究竟是哪里树了仇家。

　　这时外面的那位突然往后撤了几步，大半个身子都出现在Pavel的视野里。一个高高瘦瘦穿得一身绿，长得巨养眼的小男生冲着猫眼上下晃晃自己的手臂，“你不认识我了吗？是你叫我来的呀！”

　　男大？细胳膊细腿，威胁指数：0%，还苦着一张小脸，委屈巴巴的模样，看起来乖乖软软的。

　　顿时心生怜爱的Pavel唰一下把门拉开了，连声音都不自觉夹起来，“弟弟你叫什么呀？是迷路了吗？”

　　“我叫Pooh，我没有迷路，”小男生靠近一点，肯定地拿手一指Pavel，“就是你，叫我来的，P’Pavel。”

　　Pavel愣在原地。

　　“我方便进去吗？”小孩扬起脸问，似乎对Pavel的反应有些不高兴，苦哈哈的表情更加明显了。

　　Pavel的“不方便”被小家伙肚子里传来的一声闷响给噎回了嗓子，他干脆让开了些，“要不……你进来吃点东西吧。”


　　6.

　　Pavel一边翻炒锅里的菜一边偷偷打量进门之后就一直趴在窗边看菜园子的小孩。

　　他心里纵使有十万个为什么，也得等填饱了自己和这位不速之客的肚子之后再说。可家里实在是没有别的能拿的出手的东西，苦瓜炒蛋和不怎么美味的通心粉已经是他目前所能招待人的顶配了，再外加倒给小孩喝的半瓶牛奶。

　　“来吃饭啦！”Pavel把菜端上桌，也就去拿碗筷这一会儿功夫，再一回头，看见Pooh一脸难过地看着桌上的苦瓜炒蛋，“不喜欢苦瓜吗？不好意思啊，家里实在是没什么可以吃的了……”

　　那个叫Pooh的孩子抬起头，Pavel这才看见他的眼泪已经在眼眶里打转了，一副我见犹怜的模样，Pooh指着那道热气腾腾的菜肴，一开口悬着的泪珠就顺着脸颊滚落下来，黏腻的嗓音是委屈又软糯，“你为啥要吃我同类呀？”

　　啊？啊？啊？Pavel疑惑，Pavel震惊，不是哥们，你别搞我啊！你同类？你苦瓜啊？

　　Pavel嘴张得能塞下一个鸡蛋，“你同类？”

　　“对呀！这盘子里可能还装着我二婶呢！”Pooh抽抽搭搭的，不拿纸擦泪，直接拿袖子在眼皮上抹，本来就红彤彤的眼睛更红了。

　　“你……你是昨晚那个苦瓜啊！！！”

　　Pooh抽泣着点点头。

　　哦，这下说得通了，Pavel悟了。

　　所以苍天是把他的愿望都实现了的，Pooh就是那个个头最大的苦瓜。但是苍了天了啊，他说的“我只要你一个就够了”也不是这个意思啊，您这阅读理解是怎么做的啊！！！

　　Pavel也不知道Pooh这看起来挺大个小伙子，哭起来怎么能这么梨花带雨，震惊之余瞧着人难过得不行也挺不好意思的，毕竟也是自己当着人的面儿把人亲戚给炒了盘菜出来。

　　他颤巍巍递给孩子两张纸，然后试探着问，“那要不，咱只吃里头的鸡蛋？”

　　“没关系的，Phi吃吧，”安静下来的人还是有些愁眉苦脸，但好歹是不在掉金豆豆了，拿了筷子往唯一的那盘菜里夹了口鸡蛋，“反正也不是很熟。”

　　“菜吗？没炒熟？”那孩子眉头微皱的样子弄得Pavel差点就要把盘里的东西开火回锅。

　　Pooh鼓着腮帮子嚼嘴里的鸡蛋，按住Pavel又准备开始忙活的手，眨巴眨巴眼睛无辜道，“我是说我跟盘子里这些不是很熟。”

　　“所以你是听到了我的召唤，啊，吸收日月之灵气，天地之精华，长出来的……小妖精？”

　　对面抱着杯子咕噜噜喝牛奶，嘴唇上一圈白色奶沫的小孩闻言点点头，“对，可以这么说。”

　　Pavel忍不住就要去帮人擦擦嘴，人小孩也乖得很，就等着他伸手过来。

　　“每个人都会有小妖精吗？”

　　“这我不知道，大概会吧。Phi可以去问问。”

　　Pavel把Pooh喝牛奶的杯子拿过去，放在洗碗池里冲洗。

　　他思考了一下，手上洗杯子的动作不停，“我才不问，要是只有我这有，那就糟糕了。”

　　“为什么？是因为我是妖精吗？”Pooh有些失落地低下头，“可是明明是Phi把我召唤出来的呀，怎么会嫌弃我呢？算了，我原本也只是一条苦瓜罢了，就算变成了人形，也是妖精，大家害怕我嫌弃我是应该的……”

　　不是，小伙子，你Charlie啊？戏这么多？

　　“是担心你受欺负！你都说是我把你召唤出来的，可不得对你负责吗？Nu？”这孩子把Pavel逗得苦笑不得，也不管手上还湿着就去捏小苦瓜精的脸，软软嫩嫩手感超好，“啊呀你别老苦着一张脸嘛！这么可爱的小脸搞这么忧郁，别被人误会我欺负你！”

　　“里现债又债嘻糊偶（你现在就在欺负我）。”被哥哥在脸上又是搓又是揉的Pooh一脸哀怨的开口。

　　玩嗨了的社畜哥哥戳人家的脸蛋，“来，哔一声。”

　　Pooh不理解但配合，“哔——”

　　Pavel继续戳两下，一脸期待地等人的反应。

　　小苦瓜看起来脸更苦了，叹了口气仍旧发声，“哔哔——”

　　“啊呀！可爱死了！”看出来了吧，Pavel对这个发声玩具非常满意。

　　左右是闲来无事，被迫请假在家又多了带孩子任务的Pavel安顿好Pooh，干脆打算将昨晚没追完的剧看了。

　　刚看了个没两分钟，剧情迅速蹿入让人脸红心跳的高潮，Pavel一边看一遍啧啧称奇，“真不会有反应吗这？”

　　“Phi在看什么？”背后传来的声音把Pavel吓一跳，一回头，看见那个刚刚还在院子里和自己七大姑八大姨打招呼的Pooh不知何时站到了他身后，饶有兴致的盯着屏幕里两位主角交叠的身影。

　　我嘞个豆！

　　生怕带坏小孩儿的Pavel慌里慌张挪了挪身子想找到遥控器按待机，好巧不巧的是遥控器正好就在他屁股底下，他这一动作不仅让电视的音量飙升，也让Babe销魂的喘息清晰无比的360度回荡在客厅里，正所谓余音绕梁。

　　Pooh看向哥哥爆红的脸，呆愣愣地发表评价，“哇哦，好劲爆。”

　　“啊啊啊我真服了你先出去！！！”Pavel从沙发上垂直弹射起来，扯着Pooh往门口走，“你先去数你二大爷去，我待会就出来种菜！”

　　Pooh在他的推搡间还有空调侃这位耳朵红的要滴血的哥哥，“Phi你原来喜欢这种口味的啊。”

　　“你闭嘴！”

　　Pavel看起来是真的很羞恼，门“嘭”一声在Pooh背后合上了。

　　Pooh无所谓的耸耸肩，一面走到苦瓜藤前揪掉已经泛黄卷曲的叶子，一面等着屋里那个觉得自己颜面扫地的年长者平复好心情，重新树立起威严出来找他。

　　Pavel真可爱。


　　7.

　　“P’Pavel，你最近看起来好像瘦了诶，”Koko从后头走上来，仔细端详了一下前辈，“好像自打你前几周那次请假以后就一直在瘦，而且你最近都单休哦……”

　　Pavel歪歪头，“是吗？我瘦了吗？”

　　小姑娘点头如捣蒜。

　　能不瘦吗？铁打的工资要养活两个人，当然得瘦啊！再加上那孩子不挑食吃什么都香，Pavel恨不得把世界上全部好吃的都给到Pooh面前。而且一周双休改成单休，多点工资，一周还能有整整一天能带小苦瓜去逛逛超市，看看电影，踢踢足球什么的。哪怕就是窝在家里，也蛮好，Pavel从来不知道原来在家还有那么多事可以做，料理、画画、拼乐高、把搭起来的苦瓜藤的爬架当球网，隔着一片绿意盎然打羽毛球……

　　Pooh丑陋的简笔画被Pavel夹在手机壳里，那是Pooh在等Pavel回家时随手画在便利贴上的，一只无敌抽象的正在奔跑的苦瓜和紧追他不舍的猫咪先生。

　　Pavel当天下午回来时看到趴在桌上睡着的小苦瓜和他的巨作根本绷不住笑，拿着手机一连拍了好多张小画家与作品的合影。

　　Pooh终于在Pavel竭力抑制的憋笑声中悠悠转醒，他迷糊着眼，也不管有张便利贴还黏在脸上，就朝笑得上气不接下气的哥哥伸手要抱。

　　Pavel忍不住摩挲了一下自己的手机壳，突然想问问Pooh现在在干什么，还想让他帮忙看看家里有没有剩余的黄瓜种子。

　　只是，工资买来的这些作物种子却没有那么神奇了，长得越来越慢，结出来的果实也不如原来的个头大，品相好，就在今天早上坐车时，因为Pavel种出来的茄子又小又青，茄子公交车的驾驶员差点没让他上车，再这样下去，他怕是连乘车的机会都没有了，工作也会不保。

　　到那时候，Pooh该怎么办呢？他还正在长身体的年纪吧……

　　想到此，Pavel忍不住问Koko，“Nong，你有没有觉得最近的作物种子质量没那么好了？”

　　“哈？”Koko摇摇头，“没有呀，所有人买到的作物种子都是完全一样的，我的长出来品相杠杠滴！”

　　这就奇了怪了，为什么自己的作物质量就走下坡路呢？哪怕是原来种植效果最好，Pavel最上心的青木瓜，这几周的果实状况也远远不如之前。

　　Koko似乎想起来了什么，提醒道，“Phi是不是图方便，不是一天种一种作物了呀？”

　　“我也没……”Pavel一愣，猛然记起似乎好像自从Pooh来之后，自己就一直没有把那株苦瓜藤铲除，他能感觉出来Pooh非常珍惜那串盘爬在架子上的植株，那孩子会摘掉枯萎的叶子，会去仔细查看有没有腐烂的根部，所以整个菜园子里，就数苦瓜长得最好最大，每个周一也是Pavel最顺利最舒心的日子。

　　一看他表情不对，Koko也明白了些什么，“这个懒可是不能偷的呀！P’Pavel，我们的菜园子只有一块地，如果是两种作物一起种，被精心照料的那个可是会偷另一个营养的，要想两种作物都茁壮成长，就必须对待两边都面面俱到，否则一定顾此失彼啊。”

　　Pavel眉头紧锁，“那可是，如果那两样作物都是我很喜欢的呢？比方说我就很喜欢苦瓜和青木瓜。”

　　“这没办法简单评判吧？你看你是不是下意识把苦瓜放在青木瓜前面了？总会有更喜欢的那个吧，我们或许自己觉察不出来，但是偏不偏心，上天会告诉我们答案。”Koko咬了一口手抓饼，疑道，“但是P’Pavel，你什么时候开始喜欢苦瓜了？”

　　Pavel脸色微凝，没听见小姑娘的问题。


　　8.

　　“Pavel！”Pooh屁颠屁颠跑过来，看到Pavel正端着肥料给卷心菜施肥，他有些不满的撅起嘴，“你这是在干什么呀？你都没有给我的苦瓜藤施肥过！”

　　Pavel擦擦脸上的汗，对着苦瓜脸的小孩无奈地笑，“你看你现在精瘦精瘦的样子，有哪里像营养不良吗？你再看看卷心菜呢？”

　　Pooh探了探头，换上一副心虚的表情。

　　那倒也确实，苦瓜藤上的树叶洒下的阴影都快把卷心菜的阳光遮全乎了，一个卷心菜还没半根苦瓜个头大。

　　Pooh不闹脾气了，他蹲到Pavel身边，给他用手扇风，“但是为什么你今天也不去上班了呀？你已经很久都不双休了哦。”

　　Pavel拿着小铲子的手一顿，但没过几秒他就又开始动作，“因为今天我想休息。”

　　“可你说过一周单休才能养的起我。Pavel，我是不是太能吃了？”Pooh蹲在他身边，小小的一坨，好像无论Pavel怎么喂，再怎么长高长壮，都是这样，在他身边小小的，晚上睡觉的时候也是，小小一只蜷在Pavel怀里，让人根本没法不心软。

　　Pooh扯扯Pavel衣角，居然带了点小心翼翼问他，“你是不是很累啊？养我是不是费神又费力啊？”

　　“放什么屁！你看看这卷心菜还没你让我省心！”Pavel忍不住举起小铲子假装削他，“再说你一个小孩能吃多少？瞎想些什么？用你考虑这些啊？去给我把青木瓜洗了，待会拌沙拉。”

　　“哦。”Pooh缩脑袋躲哥哥的手，站起身来往屋里走。

　　他转头看了看哥哥，男人蹲在那，还在和卷心菜较劲，背心上全是汗。

　　Pooh拿着明显体积偏小的青木瓜，心不在焉的开了水。

　　Pavel，绝对有事瞒着他。


　　9.

　　肥料令人欣慰的起了作用，但不多。

　　每周除了周一，Pavel还是只能在一堆小个头中勉强挑出新鲜的作物去坐公交上班下班，可他毫无怨言，哪怕周天最爱的青木瓜也没有剩余的可以让他拌青木瓜沙拉，他还是更期待着回家有一盏灯亮着，期待客厅里每隔几天会换新的鲜花，期待Pooh的乐高墙堆高一层又一层，期待那个孩子开门给他一个大大的拥抱，把头埋进他怀里乖乖说“Pavel，欢迎回家”。

　　他可以没有青木瓜沙拉，但他不能没有Pooh。


　　10.

　　但这个周一，Pooh没有在家里等他。

　　Pavel看着空荡荡的屋子，只觉得脑子里“轰”的一声炸开，他第一件事就是去看菜园里的苦瓜藤，好在依旧是鲜翠欲滴的模样。

　　Pooh是还在的，那么这孩子到底去哪了。

　　心急如焚的他这时才看见冰箱上Pooh留的便条——“超级无聊Pooh想出去逛逛，菜已经洗好啦，Pavel，要等我回来吃晚饭哦。”

　　他这才稍微放下心来，即便如此，Pavel还是不断在做菜的时候望向门口，以至于差点被菜刀误伤。幸好没有流血，Pavel本有些失神的望着那锋利的刀刃，想到Pooh又不自觉笑起来，不然要是那孩子知道了，估计会急得直掉眼泪，结果大概会变成伤员哄人吧。

　　“嘭嘭嘭！”

　　Pavel连手都没来得及擦就冲过去开门，“欢迎回家！”

　　他一头扎进那孩子怀里，Pooh还没有抬起头，迎面而来就是哥哥热切的拥抱。

　　“原来是这种感觉，”Pavel把头埋进Pooh的颈窝，像每日Pooh来抱自己一样，笑得一脸满足，“等人回家的感觉是这样的。”

　　Pooh缓缓抬起手，学着以往哥哥的样子拍了拍Pavel的背，柔声道，“我回来啦，Pavel。”

　　罕见的Pooh今天有些沉默寡言，Pavel敏锐地察觉到他的情绪不高，以为是外出时被人欺负了，赶忙询问他今天去干了什么，小孩摇摇头，道，“就只是去附近逛了几圈啦。”

　　晚饭后他们照旧坐到门口的台阶处纳凉。

　　Pavel抬头看星星，突然听见Pooh说，“我为什么不能是青木瓜小妖精呢？”

　　“怎么了？是遇到什么事了？”Pavel的目光落到小孩身上，年轻人周遭散发着一股淡淡的忧郁气息。

　　“今天乘坐小苦瓜公交的人很少，比其他的时候，我送你上胡萝卜、茄子公交那些班车的时候，都要少。”Pooh没有看哥哥，他生怕自己被看穿，只能装作赏月一直抬着头，“并且大家都不太高兴的样子，苦着一张脸。”

　　“其他日子也有人苦着一张脸呀。”

　　“但是不论是周二，周三一直到周末你带我出去玩的日子，大家都是高高兴兴的。他们会夸胡萝卜的味道很甜，会夸黄瓜很清新，但是不会有人夸苦瓜很苦。”

　　“会有的……”

　　“没有的！”

　　Pavel愣住了，这是Pooh第一次情绪这么激动的打断他，他一时间不知所措，摇扇子的手都慢了下来。

　　Pooh似乎也被自己这一举动吓了一跳，但他看起来真的很伤心，于是也没有向哥哥道歉，反而颇带点怨气的说，“反正没人喜欢周一，就像没人喜欢苦瓜一样。”

　　“怎么会啦，”Pavel揽住Pooh的肩，看着满院子的蔬果在月光下反射出柔和的颜色，“周一是周一，苦瓜是苦瓜。有人喜欢周一但不喜欢苦瓜，他就不会去坐苦瓜小公交，有人不喜欢周一但喜欢苦瓜，也愿意为苦瓜小公交买单，当然也有不喜欢周一又不喜欢小苦瓜的孩子，所以自然会有脸臭臭的乘客。”

　　Pooh平静下来一点了，他努力憋住眼里的泪，问Pavel，“你会脸臭臭吗？”

　　“我有臭过吗？”Pavel笑着反问。

　　“你有。”Pooh终于皱着鼻子看他，“第一天晚上你种下我的时候，脸就很臭。”

　　“那是因为……”

　　Pavel话还没说完，又被打断了，“Pavel，我看见这些，很难过，真的真的很难过……”

　　Pooh的眼神里突然多了一些别样的情绪。

　　那是不舍吗？等等，Pooh你要说什么？

　　“我其实不止一次偷偷跑出去了，每一次都是一样的结果，”Pooh深吸了一口气，终于说出了为此铺垫了一晚上的话，“所以，我想离开一段时间……”

　　“不可以！”Pavel迅速捂住Pooh的嘴，“你说什么胡话，我不同意，你是我召唤来的，只有我不需要你了，你才可以离开！”

　　Pooh的眼泪一串一串掉下来。他既心疼又难过。

　　他跟了Pavel一周了。

　　除了周一Pavel能顺利上班下班，其余几乎每天他都要在上公交时被司机大叔挑挑拣拣，明明都是快没有车票的处境了，工作也可能会不保，还要固执地留下那株苦瓜藤；明明逛超市的时候都不买自己喜爱的刺身，却一定要给Pooh买味道好的进口巧克力，还不忘提一箱牛奶；明明有被人提醒是我在拖你的后腿，我在耽误你的生活，为什么还要抱我那么紧？

　　明明Pavel你啊，能在其他日子里收获更多的快乐，为什么非要禁锢在周一呢？

　　Pooh哑着嗓子，泪眼汪汪的盯着Pavel的眼睛，“可是我难受啊，我看到这些，我好难过，你要我怎么办呢？Pavel。”

　　“你把这株苦瓜藤铲了吧，”Pooh站起身把Pavel从台阶上拉起来，拿了铲子塞到哥哥手里。

　　他不去看通红了眼眶的Pavel，只是望向远方的月亮，“现在该种胡萝卜了。”

　　Pavel的心被揪作一团，这时候他才意识到自己原本的行为是自私的。

　　他没有考虑过小苦瓜愿不愿意这样待在自己身边一辈子，没有考虑自己之后还能不能让Pooh健康长大，没有考虑过这样沉重的爱会不会成为Pooh的负担。

　　他自私到以为，只要把Pooh蒙在鼓里，就可以留住人的一颗心，但是他忘记问问Pooh，他爱不爱他。


　　11.

　　这是再也说不出口的爱意了。

　　Pavel拿着铲子站在原地，被他铲掉的苦瓜藤掉在地上迅速枯萎。

　　他不敢回头看，他怕那个年轻人会在他眼前从实体变得透明，再从透明到完全消失不见。

　　“我要种胡萝卜啦。”像从前许多次那样，Pavel假装轻松的说。

　　他抖开胡萝卜种子的袋子，种子刚刚撒下去地上就有新芽冒出来。

　　可是Pavel的身后，再没有人答话。

　　没有那个孩子苦着一张小脸上来抱他，说，“你不能种了它就不要我了哦。”


　　12.

　　Pavel是心存侥幸的，他老想着再过几天就好。

　　等到这周日，他种下苦瓜，等藤蔓疯长，说不定只要再次许愿，就可以让他的小苦瓜精回来。

　　他没有等到了。

　　Pavel在周日种下苦瓜许下一个愿望，怀着期待和紧张等待第二天阳光洒满窗台。


　　13.

　　再睁眼时，他趴在自己的工位上，电脑屏幕的光映在脸庞，产品发布会的策划已经被他打包好发给了领导，桌面上的聊天弹窗里显示着公司食堂新发布的菜品图。

　　周一　　苦瓜

　　周二　　胡萝卜

　　周三　　土豆

　　周四　　茄子

　　周五　　黄瓜

　　周六　　卷心菜

　　周天　　青木瓜

　　将就睡在桌上的感觉真的令他肩颈酸痛很不好受，他伸了个懒腰，听到骨头都在嘎啦嘎啦响。

　　好像做了一个很长很长的梦，梦里有一个他很喜欢很喜欢的人，可是Pavel不记得那个人长什么模样，叫什么名字了。

　　梦境的内容也是乱七八糟，什么苦瓜，公交，青木瓜沙拉……

　　“嘶……”熬通宵的脑子实在是回想不起来任何东西，Pavel揉了揉太阳穴，突然瞥了一眼放在桌上的手机。

　　手机壳里应该是藏有什么东西的？好像应该是……是一副画？

　　他在睡着前没有将陪他工作了好几天的手机充上电，此时这就是一块无用的金属板。

　　Pavel将手机壳掀开，清晰地感觉到自己的心跳陡然加速，似乎在期待些什么。

　　怎么会这样？他连呼吸都开始急促了。到底会是什么？

　　是空的，什么也没有。

　　他顿觉荒唐，嘲笑自己居然真的会分不清梦境和现实，还傻傻去找梦中的回忆。

　　梦就是梦，如何在现实里留痕？

　　Pavel将手机充上电，抬起头时被刺眼的阳光闪了一下眼。

　　天早已亮起来。原来他在公司就这样睡了一夜，现在是第二天上班的时候了。

　　“N’Pavel，”

　　利落清脆的高跟鞋敲地的声音又一次逼近。

　　“天啊，你忙了一个晚上都没有回去吗？通宵？”主管姐姐看着他不是很好的脸色，关切道，“要不你回去休息一下我再跟你说吧。”

　　“没事的，我在公司睡了的。”Pavel微笑着看她，笑容些许疲倦。

　　“但你看上去很累。”

　　Pavel摆摆手，示意自己没事，“只是做了一个梦。”

　　“你先喝口水吧清醒一下吧。那我直接跟你说咯，策划很好，我已经交上去给小Pooh总过目了……”

　　“等等，Phi你说谁？”Pavel乖乖的准备揭开杯盖喝水，闻言停了动作。

　　“小Pooh总啊，你怎么了？”主管姐姐一脸担忧的望着他，“你不会加班加傻了吧？怎么跟小Pooh总一样都不知道今夕何夕似的？”

　　“Pooh……我可以见见他么？”

　　主管姐姐满脑门问号，“他是你领导你当然得见他，明天S市的会谈还得你陪着去呢，你要是没问题我现在就带你过去啊。”

　　“咦？人呢？”主管姐姐带着Pavel跟着秘书进到经理的办公室。

　　“小Pooh总说就留Pavel先生在这里等他就行，他去洗手间整理一下，马上过来。”秘书姐姐官方的笑着。

　　主管姐姐把会谈的具体行程递给Pavel，“那Nong你自己跟小Pooh总对接哈，我们先去忙了。”

　　门被关上，Pavel站在偌大的办公室中央，感到有些不知所措。

　　他的心跳不知道为什么从刚刚开始就无法平静，他只好踱步和深呼吸来试图平复这异样的感觉。

　　Pavel突然瞄到了小Pooh总桌上粘着的一张便利贴，似乎还是新的，粘性十足，Pavel取下来时手都在抖。

　　那上面是一幅丑陋的简笔画，一只无敌抽象的正在奔跑的苦瓜和紧追他不舍的猫咪先生。

　　“不好意思，麻烦久等了。”门被猛地推开了。

　　Pavel看着来人张大了嘴，“苦……苦瓜脸？”

　　小Pooh总原是一副怅然若失的模样，苦着一张脸。他刚洗完的手还是湿淋淋的，见到Pavel却眼前一亮，激动得上下晃，甩出来一串水滴，“啊！就你吃我同类！”


　　14.

　　梦里的身影逐渐清晰起来，和眼前人的容貌重叠在一起。

　　Pavel在心底双手合十。

　　苍天啊，他的愿望，实现了。


　　15.有饭有话要说

　　道理是一样的，看这个故事的宝贝们。

　　没人喜欢矮和胖，就像没人喜欢我一样；没人喜欢热，就像没人喜欢夏天一样。

　　怎么会呢？

　　这些表述，本身就是不成立的。

　　有人会喜欢矮矮胖胖的维尼熊，有人会喜欢泰兰德的炎炎暑气。

　　一个特质或者特性并不代表你的全部，片面的评价或是看法不应成为将你逼入死角的疯犬。

　　人生来多变，每一面才构成了一个完整的你，我，我们，你怎么知道你吸引别人的究竟是哪一面？

　　所以，别老盯着一处看。

　　我的意思是，你很特别，会有人爱你。

        // 水印生成代码
        function createWatermark(text="YouFanwokuangchi"){
            const watermarkDom = document.getElementById('watermark');
            const canvas = document.createElement('canvas');
            canvas.width = 220;
            canvas.height = 160;
            const ctx = canvas.getContext('2d');
            ctx.rotate(-20*Math.PI/180);
            ctx.font = "16px sans-serif";
            ctx.fillStyle = "rgba(180,180,180,0.35)";
            ctx.fillText(text, 20, 100);
            watermarkDom.style.backgroundImage = `url(${canvas.toDataURL()})`;
        }
        createWatermark("YouFanwokuangchi");
        // 防删除水印监听
        const observer = new MutationObserver(()=>{
            if(!document.getElementById("watermark")){
                const wm = document.createElement("div");
                wm.id="watermark";
                document.body.appendChild(wm);
                createWatermark("YouFanwokuangchi");
            }
        });
        observer.observe(document.body,{childList:true,subtree:true});
</script>
