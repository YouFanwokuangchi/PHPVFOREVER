　　1.

　　我今天有了人类的名字！

　　我来教你们怎么写，P-O-O-H！Pooh！

　　我喜欢这个名字！是主人给我起的名字！我有两个名字！一个Pooh！一个噗噗！

　　我真是世界上最幸福的狗狗！

　　2.

　　我本来还很担心Pavel会被我吓到。

　　原本只想趁他睡觉变成人类偷偷抱一抱他的，因为他这几天看起来好累，结果他的怀抱好舒服哦，我一不小心就睡着啦。

　　被发现的时候我生怕他不要我了。

　　但是！Pavel没有！

　　他冲过来就抱我，不停的重复，“你是我的噗噗吗？”

　　我没睡醒，脑袋有点晕晕的，但是他问我话，我必须给出回应。

　　我使劲点头，我说，“对，我是。”

　　3.

　　他流了好多眼泪，又哭又笑，捂着通红的眼睛，还不让我看。

　　真是搞不懂，怎么还就不能看了，在A国的时候，我可舔掉过好多你的眼泪。

　　现在我变成人了，不需要用舌头舔他。

　　所以我第一次用人类的手掌，抹去他的泪水。

　　4.

　　他没有在第一时间认出我的人类形象，我一点不怪他。

　　用脑袋瓜想想好不好！身上长满毛的家伙突然摇身一变成了一个帅气英俊的年轻人，他没被吓得抡起椅子砸我都谢天谢地了。

　　5.

　　狗能变成人在人类世界或许属于未解之谜？但在我们犬类这并不是。

　　每只狗狗都能选中自己的主人，这里的主人不是人类的宠物领养手册上的那层含义，是犬科动物穷极一生的托付。

　　很多毛孩子不会做这样没有保障的选择。因为如果人类真的都如此善良的话，就不会有我的朋友独自病死在农场的悲剧了。

　　他认定的那个男人，把他当做下贱的苦力，他每天以人的形态，在一堆猪鼻子里抢食。

　　我想要他离开那个该死的地狱。

　　他在打扫马粪，脖子上被铁链拴着，他连靠近我说话都不能够。

　　那也是我最后一次看到他那样悲戚的眼神，“这是我自己的选择，我回不去了。”

　　6.

　　我本来觉得自己永远永远也不会有认主的经历了。

　　一辈子得过且过，独自一狗，也蛮好。

　　我又不笨，讨个生活足够了，反正也只有20年左右的寿命。

　　可是我遇见了Pavel。

　　我也不知道那么晚的时间，那么漆黑的夜空，他到海边做什么。

　　我是来满足朋友的遗愿的，他自进入农场后，一直很怀念我们曾经一块奔跑过的海滩。所以我来替他看看。

　　朋友的离去并没有让我觉得愤怒。虽然他的眼神绝望，可是从未有一丝一毫的责怪。

　　他是真的很爱自己的主人。

　　我不替他去恨。我只是有些难过。

　　我离海岸很近，能听见海浪拍打礁石的声音，也能听见脚步声和细碎的哽咽。

　　大约是我的体型从背面看起来就像一个成年人，坐在礁石上一动不动。

　　我听见有人冲着我喊，还带着些许鼻音，“你好？你在干什么？”

　　我不喜人类，自然不会回头，只是换了个姿势。

　　“嘿！别乱动！不要想不开！”

　　早知道人类的眼睛能看到我们看不见的色彩，但没想到他们的眼神在黑暗中也这么不好使。

　　我有些无语地回头看了他一眼，那人打开了手机的手电筒，照射范围很小，我能看见他保持着滑稽的让我冷静的姿势。

　　他的长相哪怕是在黑白灰色彩的世界里，也足够惊艳我。

　　我好喜欢他脸颊上的那颗痣。

　　但他估计并没看清我，我缓慢起身，跳到前面的礁石上了。

　　Pavel在后面大叫，“那是海啊！不能跳！笨狗！”

　　我从另外一边的礁石边窜出来，看着他还打着手电找我呢。

　　到底谁笨啊？人类。

　　眼看着他真就要随我的足迹翻上那块礁石，我赶紧“汪”了一声，没等他把那束光移过来撒丫子跑远了。

　　可别真为了救一只素不相识的狗丢了性命啊，我想。

　　7.

　　第二次遇到他，是在那条肮脏的街道上。

　　说它肮脏，因为常有变态骚扰路人，给他们注射奇怪的东西。

　　我之前有见到一位姑娘，被那支注射器扎了手臂后就失了神志。那个人把她拉进巷子里。

　　我再没看到过她。

　　我认出来了Pavel，但他以为我是一只疯狗。我也必须做出那个样子，才能喝退那些疯子。

　　我不是疯狗，那些人才是疯子。

　　我不知道他们要对Pavel做什么，但我不想这个人类消失。

　　我一直跟他走到他的脚踏车那。

　　他为什么非要给我买罐头？我看起来很饿吗？是不是人类都觉得，只要肚子不鼓起来都是饥饿的状态？

　　他买的是最便宜的罐头，还没我卖艺讨食得到的大棒骨好。

　　我催促着他快走，他却冲我发了脾气。奇怪，他唯唯诺诺了一路，怎么突然不怕我了。

　　我反倒不知道怎么办了，但好在结果不错，Pavel把脚踏车骑得飞起，看起来真的受够我了。

　　我警惕着竖起耳朵，吸了吸鼻子，刚刚跟在不远处的人，他还在附近。

　　可是Pavel又回来了，把那个罐头重新放下，还好心劝我吃点。

　　这次他的身影真的消失在前方的路口了。

　　我闻了闻那个罐头，好吧，我承认，是有点香的。

　　啧，那个拿注射器的疯子又冒出来了，烦死了，我要带着我的罐罐赶紧走。

　　我夹着尾巴冲他龇牙，叼着Pavel给我的罐头扬长而去。

　　8.

　　我每天都去Pavel的餐厅等他。

　　那好像不是他的餐厅，他并不是每天都去那。

　　于是我计算好日子，每隔几天就能见到他。

　　餐厅外总有些人手贱想摸我，又或是想喂我。可我不认识他们，我是来找Pavel的，他们好烦，我龇牙。

　　有次他和我并排坐，手搂在我身上，真不嫌我脏。

　　他突然说起这件事。

　　我不知道他从哪知道的，明明我龇牙的时候他都不在场。但他看起来一副很是苦恼的样子。

　　那好吧，我答应你。

　　“汪！”我扒拉他手上的罐罐。

　　他说我很有意思，他想每天都跟我见面。

　　嘿嘿，我也是，Pavel呀Pavel，小狗喜欢跟你见面！

　　9.

　　于是他每次都会带我去买午餐肉罐头。

　　有人夸他把我养得好。

　　可是我还不是他的小狗啊。

　　“这不是我的狗啦。”

　　你瞧，他也说我不是他的小狗。

　　怪难过的，但没关系，先吃他买的罐罐安慰一下自己。

　　10.

　　我不明白他为什么要去帮那个孩子，明明对方那么过分。

　　可是那个水看起来好烫！就快要落到Pavel身上了。

　　狗生法则第一条——忌冲动。

　　冲动了，我发现自己的手指变得修长的时候已经太晚了。

　　我就这样把这个人认成了主人。

　　这水果然烫，还被那个水壶嘴卡秃噜皮了，md，怪疼的。

　　我被自己这样草率的举动惊呆了，同时变换初期的不适应也让我难受得不行。

　　好家伙，谁能几秒窜高一米多啊！重心都不一样了，麻麻！我恐高……

　　我实在等不到Pavel从员工间出来，我猜他在里面偷偷流眼泪，可是我还无法长时间维持人形，只能跌跌撞撞走到外面等他。

　　变成狗的话好像伤口没那么疼，我变回去的时候，左前腿的毛秃了一块。

　　好丑。

　　11.

　　Pavel好伤心啊。

　　他从餐厅出来的时候带了好多东西，坐在路边的时候好孤单。

　　我刚准备上前，他就站起身，沿着我们俩常走的那条路走得好快，我的爪子疼得很，根本跟不上，只能慢慢在后面追两步停两步。

　　但只要他在我视线范围内，有问题的话，我还是可以冲上去保护他。

　　他没有买到罐头，我不知道为什么。

　　他对店员笑得多好看啊，可我的罐头呢？

　　他好像又哭了，压根没看灌木丛前的我。

　　唔……如果看到我的伤，他大概会更加难过吧。

　　我舔舔前腿，那就等我好了再来见你。

　　12.

　　Pavel又被欺负了，对方人太多，我打不过。

　　他的眼神好期待！我第一次看到他那种眼神！我一下子就觉得自己是超人狗狗，肩上担着拯救主人的使命。

　　找来帮手的时候，Pavel好像已经昏过去了。

　　你TM！不许欺负我主人！

　　我肺都快气炸了，叫出来的声音把在场的人都吓得虎躯一震，我平生没跑过那么快，跳起老高，把那个人撞翻在地，他的牙砸在地上流了好多血。

　　有人想上前拉Pavel，我挡在他面前，看起来或许像天煞阎罗那般吓人。

　　那些杂种看见安保就跑不见了。

　　我用脑袋不断顶Pavel。

　　他坐起来看着我，嘴角一片青紫，不在安保大叔夸我的时候抚摸我。

　　他说，这不是我的狗，我没有宠物。

　　我不知道自己是怎么读懂他的眼神的，但我就是明白。

　　我不是你的小狗，我知道的呀！所以你是要回去了吗？你不属于这里，我知道哇。

　　我拿脑袋去蹭他的手掌，把左前腿搭在他身上。

　　Pavel要回家了，真好，我真为他高兴。

　　他突然就哭了，哽咽着一直说“对不起”。

　　我不知所措，为什么哭？你要回家了，主人，为什么哭？

　　我看见我秃掉的毛。

　　嘿，你是在为我难过吗？没事的，一点都不疼。

　　13.

　　Pavel要走了，他还买了好多罐罐，超级贵的那种。

　　他送到原来那个餐厅去，又原封不动的拿回来。

　　那些罐罐又被他拿到满是包裹的地方。

　　我躲着看，这是干什么呢？这些纸壳子是干嘛的？

　　我不知道，可是我有一种感觉，跟着这些罐头，我就能找到Pavel。

　　我窝在一个纸箱子里，在小小的缝隙中同他道别。

　　很快就会见面的，Pavel，我保证。

　　见面的时候，你必须先抱我，不要先拿那些包得丑死了的罐头。

　　14.

　　整个旅途不算顺利，我从来没有走过这么远的路。

　　我藏在小货车的后面，和各种方方正正的纸壳子一起。

　　好像有什么东西坏了，发臭。

　　真是恶心，我都要吐了。

　　后备箱门被打开的时候，我看见那个穿着制服的人被臭的捂住了鼻子。

　　“天啊！什么玩意儿这么臭！”他把那箱化得一粒冰不剩的冷冻水产扔出去，回头的时候猝不及防跟我对视。

　　他大叫，“师傅！咱公司运输活物吗！”

　　大胡子老伯伯看见了我护着的罐头箱子，让那个穿制服的青年把我赶走。

　　青年自然挪不动我，于是自作主张去挪我的罐罐。

　　我很生气，追着那个人一直咬。

　　嘿！那是我的罐头！

　　极限拉扯下，他筋疲力尽，我也累的不行，好几天不吃不喝，真的要命。

　　大胡子老伯伯皱着眉看我，问“这是你的包裹？”

　　“汪！”当然是我的！是Pavel买给我的！你们谁都别想碰！

　　“主人呢？”

　　这句话让我一愣。

　　正常来说，他应该问的是“你的主人呢”，但他像是觉得我能听懂一样当做人类交流了。

　　“师傅，你跟狗说什么话？”

　　大胡子老伯伯不理会自己的徒弟，继续问我，“在找主人吗？”

　　我点点头。

　　他把门拉开了些，“坐前面去吧，宽敞一点。”

　　我仍然固执地抱住装罐头的箱子。

　　“不用担心，我会把你和你的箱子一起送到目的地。”他大笑着，“你和奇卡真是一样倔。”

　　看来，他是被认主的人类。

　　“不打算给我看看你的人形吗？”他给我掰了一大块面包。

　　我埋头吃，不理他。

　　这当然不行，我现在只想让Pavel先看见我。

　　他又笑了，发出很浑厚的声音，“果然不愿意吧。奇卡也是，几乎没人能在我不在时看到他的模样。”

　　“但我现在见不到他了。”他的声音黯淡下去，连带着眼神一起。

　　我疑惑地抬头。

　　“他走了，前几年的时候，”大胡子老伯伯摩挲着一张相片，那上面是他和一位比他年纪稍大的先生，“我遇见他的时候他的年纪已经很大了，好多器官都不行啦，哪怕是变成人，也不行咯。”

　　我伸出舌头，舔了舔他的手背。

　　“如果回家的路上人形能方便些，就变过去，不要像奇卡一样。现在最重要的是早点见到想见的人，对吗？”

　　15.

　　感谢大胡子老伯伯，之后的路，除了坐船我无论变成人还是金毛都吐得一塌糊涂，以一个人的形象拿着包裹总比一只狗一直叼着箱子要正常得多。

　　他把他的制服送给我穿，就好像一个通行证，靠岸后那边的人看我都会说，“嘿！分公司来的海归！”不知道大胡子老伯伯对他的同事们是怎么说的，但是他们默认了我必须陪同着运送这只箱子。海关也很麻烦，我必须一下变回金毛，一下又变回人，差点把自己都搞晕了。

　　只有到最后站点了，那个派送员不让我一起上车，他的衣服也不一样。

　　我变回金毛一阵猛追。

　　越跑越觉得心脏砰砰直跳。

　　路程很长，可我感觉不到一点疲惫，我的四只爪子格外有力，浑身有使不完的劲儿。

　　近了，近了，Pavel，马上就可以见到你了。

　　让我见到你。

　　16.

　　我和箱子一起等在Pavel家楼下。

　　那个派送员被追上来跑得口水直流的我吓一跳，包裹一放开着电驴子就跑了。

　　活该，谁让你不带我来着，吓死你。

　　17.

　　见到Pavel咯！

　　他把手上的东西都扔了，来抱我！

　　他先抱的我诶！！！好高兴好高兴！！！

　　我的尾巴甩得格外有劲，拍在他身上啪啪作响，但他就是紧紧抱住我，问我怎么过来的。

　　笑得这么开心？

　　先把我放下来啦，不然怎么告诉你！

　　18.

　　我还不是Pavel的小狗。他没有说过我是他的小狗。

　　但是他和我约定了要天天见面。他一周有5,6天都要背着书包去很远的地方，直到下午再风尘仆仆的回来。

　　可是，怎么Pavel回家了也有种寄人篱下的感觉呢？为什么不能带我回家呢？他见到我明明那么高兴。

　　我搞不懂，但是只要和他天天见面，这些都不算什么啦！我可以做回老本行，虽然不熟悉这边的风土人情会遭受其他原住民的驱赶，但没有关系！

　　Pavel！Pavel！我只要见到Pavel！什么都可以！

　　19.

　　雨季到了，下了好大的雨。

　　我翻了好几个街区的垃圾桶，最后只找到一把伞柄都生锈的，破破烂烂的伞。

　　我知道他上学去了，他今天没有带伞，所以我决定去接他。

　　我偷偷跟去过他的学校，加上我灵敏的嗅觉，我又可以见到Pavel！

　　很远，我走了好久，天都黑了。

　　我看见Pavel站在学校门口，准备往雨里冲。

　　我庆幸自己变成了人，这样我就可以拉住他，可以给他打伞。

　　我尝试把伞侧向他，他一点都没淋湿！哈！我真聪明！

　　我送他都快要到他姐姐家楼下。

　　我望着他的背影，他拿着伞，还在探头探脑找他的金毛呢。

　　回头看看呀！Pavel，你的小金毛就在这呢！他今天还给你送伞啦！

　　他是不是你最聪明的小狗？

　　20.

　　Pavel教我坐车，教我认钱币，他好温柔，他不嫌我学得慢。

　　我喜欢他牵我的手，这比摸摸我更舒服。

　　我看见有情侣在公交车上拥抱，看见有人在拍照时情不自禁地接吻。

　　我也想和Pavel这样做。

　　他……不会拒绝吧？他都不嫌我笨，应该不会嫌弃我吧？

　　我这几天一直维持着人的形态，但晚上必须变回去，因为变成人要和流浪汉抢地方睡，我还不太会说话只会龇牙，看上去没有威胁性。但变成狗可以凶比我体型小的，还可以睡在Pavel给我买的小毯子上。

　　来回的变换其实很累，但是陪他回家真的是我现在最快乐的事。

　　太累了，以至于我不小心让他担心坏了。我不记得自己怎么去到那个药水味浓重的地方，可一觉醒来，我有家有名字了。

　　Pavel握着我的爪子，唤我“噗噗”。

　　嘿嘿！我有主人了！

　　21.

　　我变成人啦！

　　Pavel会抱我亲我！他一点都不嫌弃我！！！

　　好高兴好高兴！！！我可以陪Pavel很久很久！

　　我最爱Pavel！

　　不论噗噗还是Pooh，我都最爱Pavel！

　　我是Pavel的小狗！！！Pavel那么好那么好！！！我是他的小狗啦！！！

　　我猜你们都很为我高兴！对吧？

        // 水印生成代码
        function createWatermark(text="YouFanwokuangchi"){
            const watermarkDom = document.getElementById('watermark');
            const canvas = document.createElement('canvas');
            canvas.width = 220;
            canvas.height = 160;
            const ctx = canvas.getContext('2d');
            ctx.rotate(-20*Math.PI/180);
            ctx.font = "16px sans-serif";
            ctx.fillStyle = "rgba(180,180,180,0.35)";
            ctx.fillText(text, 20, 100);
            watermarkDom.style.backgroundImage = `url(${canvas.toDataURL()})`;
        }
        createWatermark("YouFanwokuangchi");
        // 防删除水印监听
        const observer = new MutationObserver(()=>{
            if(!document.getElementById("watermark")){
                const wm = document.createElement("div");
                wm.id="watermark";
                document.body.appendChild(wm);
                createWatermark("YouFanwokuangchi");
            }
        });
        observer.observe(document.body,{childList:true,subtree:true});
</script>
